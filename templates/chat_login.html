{% extends "base.html" %}
{% block title %}Support Chat — {{ settings.get('site_name', 'Topupjo') }}{% endblock %}
{% block content %}
<div class="container">
  <div class="chat-login-wrap">
    <div class="chat-login-card">
      <div class="cl-ic"><span class="ico ico-chat"></span></div>
      <h2>Support Chat</h2>
      <p class="sub">চ্যাট করতে লগইন করুন। অ্যাডমিন হলে নিচে অ্যাডমিন লগইন ব্যবহার করুন।</p>
      <a href="{{ url_for('login') }}" class="btn btn-primary btn-block"><span class="ico ico-user"></span> User Login</a>

      <div class="cl-sep"><span>Admin access</span></div>
      <form method="post" action="{{ url_for('chat_home') }}">
        <div class="field">
          <label>Username / Email</label>
          <input type="text" name="username" placeholder="admin@topupjo.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-dark btn-block"><span class="ico ico-shield"></span> Admin Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
