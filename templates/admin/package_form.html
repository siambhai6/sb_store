{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if package else 'New' }} Package — Admin{% endblock %}
{% block heading %}{{ 'Edit Package' if package else 'New Package' }}{% endblock %}
{% block content %}

<div class="card form-card">
  <form method="post">
    <div class="form-grid">
      <label class="field">
        <span>Product *</span>
        <select name="product_id" required>
          <option value="">— Select product —</option>
          {% for p in products %}
          <option value="{{ p.id }}" {{ 'selected' if package and package.product_id == p.id }}>{{ p.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="field">
        <span>Package Name *</span>
        <input type="text" name="name" value="{{ package.name if package else '' }}" placeholder="e.g. 100 Diamond" required>
      </label>
      <label class="field">
        <span>Amount / Label</span>
        <input type="text" name="amount" value="{{ package.amount if package else '' }}" placeholder="e.g. 100 Diamond">
      </label>
      <label class="field">
        <span>Price (৳) *</span>
        <input type="number" step="0.01" name="price" value="{{ package.price if package else '' }}" placeholder="0.00" required>
      </label>
      <label class="field">
        <span>Discount Type</span>
        <select name="discount_type" id="discountType">
          <option value="none" {{ 'selected' if not package or package.discount_type in ['none', '', None] }}>No discount</option>
          <option value="percent" {{ 'selected' if package and package.discount_type == 'percent' }}>Percentage (%)</option>
          <option value="fixed" {{ 'selected' if package and package.discount_type == 'fixed' }}>Fixed amount (৳)</option>
        </select>
      </label>
      <label class="field">
        <span>Discount Value</span>
        <input type="number" step="0.01" min="0" name="discount_value" value="{{ package.discount_value if package and package.discount_value else '' }}" placeholder="e.g. 10 or 50">
        <small class="muted">Percentage: 1–100. Fixed: amount off the price.</small>
      </label>
      <label class="field">
        <span>Sort Order</span>
        <input type="number" name="sort_order" value="{{ package.sort_order if package else 0 }}">
      </label>
      <label class="check field-full">
        <input type="checkbox" name="active" {{ 'checked' if (package.active if package else True) }}>
        <span>Active (available for purchase)</span>
      </label>
      <label class="check field-full">
        <input type="checkbox" name="stock_out" {{ 'checked' if package and package.stock_out }}>
        <span>Stock Out (hide from customers — nobody can buy this package)</span>
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ 'Save Changes' if package else 'Create Package' }}</button>
      <a href="{{ url_for('admin_packages', product_id=package.product_id if package else None) }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}

<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
