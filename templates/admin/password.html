{% extends "admin/base.html" %}
{% block title %}Change Password — Admin{% endblock %}
{% block heading %}Change Admin Password{% endblock %}
{% block content %}

<div class="card form-card narrow-card">
  <div class="card-head"><h2><span class="ico ico-key"></span> Update Password</h2></div>
  <form method="post">
    <div class="form-grid">
      <label class="field field-full">
        <span>Current Password</span>
        <input type="password" name="current_password" required autocomplete="current-password">
      </label>
      <label class="field field-full">
        <span>New Password</span>
        <input type="password" name="new_password" required minlength="6" autocomplete="new-password">
      </label>
      <label class="field field-full">
        <span>Confirm New Password</span>
        <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Update Password</button>
    </div>
  </form>
  <p class="hint">Password must be at least 6 characters. You will stay logged in after changing it.</p>
</div>

{% endblock %}

<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
