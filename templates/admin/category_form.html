{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if category else 'New' }} Category — Admin{% endblock %}
{% block heading %}{{ 'Edit Category' if category else 'New Category' }}{% endblock %}
{% block content %}

<div class="card form-card">
  <form method="post" enctype="multipart/form-data">
    <div class="form-grid">
      <label class="field">
        <span>Category Name *</span>
        <input type="text" name="name" value="{{ category.name if category else '' }}" placeholder="e.g. Free Fire Diamond" required>
      </label>
      <label class="field">
        <span>Icon</span>
        <select name="icon">
          {% set icon_keys = ['gem','crown','fire','gift','phone','gamepad','star','bolt','card','wallet'] %}
          {% set cur_icon = (category.icon if category else 'gamepad')|cat_icon %}
          {% for ic in icon_keys %}
          <option value="{{ ic }}" {{ 'selected' if cur_icon == ic }}>{{ ic|capitalize }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="field field-full">
        <span>Description</span>
        <textarea name="description" rows="2" placeholder="Short description shown on the category card">{{ category.description if category else '' }}</textarea>
      </label>
      <label class="field">
        <span>Sort Order</span>
        <input type="number" name="sort_order" value="{{ category.sort_order if category else 0 }}">
      </label>
      <label class="field">
        <span>Image (optional, auto-resized)</span>
        <input type="file" name="image" accept="image/*">
        {% if category and category.image %}
        <div class="img-preview"><img src="{{ url_for('static', filename='uploads/' + category.image) }}" alt=""></div>
        {% endif %}
      </label>
      <label class="check field-full">
        <input type="checkbox" name="active" {{ 'checked' if (category.active if category else True) }}>
        <span>Active (visible on the website)</span>
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ 'Save Changes' if category else 'Create Category' }}</button>
      <a href="{{ url_for('admin_categories') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}

<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
